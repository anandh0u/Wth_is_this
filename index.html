<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lui</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="lui-app">
      <section class="view home-view active" id="home" aria-label="Lui home">
        <img class="home-art" src="public/luiappland.svg" alt="Lui: your chaotic desktop pet" />
        <div class="home-actions" aria-label="Open a Lui feature">
          <button data-view="graph" class="home-action graph-action">Lui Graph</button>
          <button data-view="chat" class="home-action chat-action">Lui GPT</button>
          <button data-view="schedule" class="home-action assign-action">Assign Task</button>
          <button data-view="tasks" data-list="scheduled" class="home-action schedules-action">Schedules</button>
          <button data-view="tasks" data-list="void" class="home-action void-action">Void</button>
        </div>
      </section>

      <section class="view pixel-screen graph-view" id="graph" aria-label="Lui graph">
        <img class="screen-art" src="public/luigraph.svg" alt="Lui mood graph: annoyed, happy, sad and scared" />
        <button class="screen-back" data-view="home" aria-label="Return to Lui home">←</button>
        <button class="mood-target annoyed-target" data-mood="annoyed" aria-label="Annoyed: high energy and unpleasant">Annoyed</button>
        <button class="mood-target happy-target" data-mood="happy" aria-label="Happy: high energy and pleasant">Happy</button>
        <button class="mood-target sad-target" data-mood="sad" aria-label="Sad: low energy and unpleasant">Sad</button>
        <button class="mood-target scared-target" data-mood="scared" aria-label="Scared: low energy and pleasant">Scared</button>
        <p id="mood-status" class="screen-reader-status" aria-live="polite"></p>
      </section>

      <section class="view pixel-screen chat-view" id="chat" aria-label="Chat with Lui">
        <img class="screen-art" src="public/luigpt.svg" alt="Lui GPT" />
        <button class="screen-back" data-view="home" aria-label="Return to Lui home">←</button>
        <div class="chat-panel">
          <div class="messages" id="messages" aria-live="polite"></div>
          <form class="chat-compose" id="chat-form">
            <input id="chat-input" autocomplete="off" maxlength="500" placeholder="Tell Lui what you are avoiding..." aria-label="Message Lui" required />
            <button type="submit">Send</button>
          </form>
        </div>
      </section>

      <section class="view schedule-view" id="schedule" aria-label="Assign a task">
        <div class="pixel-screen schedule-screen">
          <img class="screen-art" src="public/uitaskassigner.svg" alt="Assign a task" />
          <button class="screen-back" data-view="home" aria-label="Return to Lui home">←</button>
          <form class="schedule-form" id="task-form">
            <input name="name" maxlength="160" placeholder="Name" aria-label="Task name" required />
            <input name="date" type="date" aria-label="Task date" required />
            <input name="time" type="time" aria-label="Task time" required />
            <button type="submit" aria-label="Save task">Save</button>
          </form>
        </div>
        <section class="calendar-panel" aria-labelledby="calendar-title">
          <div class="calendar-heading"><button id="calendar-previous" aria-label="Previous month">←</button><h2 id="calendar-title"></h2><button id="calendar-next" aria-label="Next month">→</button></div>
          <div class="calendar-weekdays" aria-hidden="true"><span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span></div>
          <div class="calendar-grid" id="calendar-grid"></div>
        </section>
      </section>

      <section class="view pixel-screen list-view" id="tasks" aria-label="Schedules and void">
        <img class="screen-art" src="public/luilist.svg" alt="Lui task list" />
        <button class="screen-back" data-view="home" aria-label="Return to Lui home">←</button>
        <div class="list-switch" aria-label="Choose a list"><button data-list-tab="scheduled">Schedules</button><button data-list-tab="void">Void</button></div>
        <div class="task-list" id="task-list"></div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
